<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="TECIL Solar — photo coming soon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0b"/>
      <stop offset="1" stop-color="#1f1f1f"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8601a"/>
      <stop offset="1" stop-color="#ff9a4d"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="38%" r="42%">
      <stop offset="0" stop-color="#e8601a" stop-opacity=".22"/>
      <stop offset="1" stop-color="#e8601a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>

  <g transform="translate(800 330)">
    <circle r="96" fill="none" stroke="url(#orange)" stroke-width="5" opacity=".85"/>
    <g stroke="url(#orange)" stroke-width="5" stroke-linecap="round" opacity=".85">
      <line x1="0" y1="-130" x2="0" y2="-112"/>
      <line x1="91.9" y1="-91.9" x2="79.2" y2="-79.2"/>
      <line x1="130" y1="0" x2="112" y2="0"/>
      <line x1="91.9" y1="91.9" x2="79.2" y2="79.2"/>
      <line x1="0" y1="130" x2="0" y2="112"/>
      <line x1="-91.9" y1="91.9" x2="-79.2" y2="79.2"/>
      <line x1="-130" y1="0" x2="-112" y2="0"/>
      <line x1="-91.9" y1="-91.9" x2="-79.2" y2="-79.2"/>
    </g>
    <path d="M14 -58 L-28 8 H-2 L-14 58 L28 -8 H2 Z" fill="url(#orange)"/>
  </g>

  <text x="800" y="530" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="700" letter-spacing="2">TECIL SOLAR</text>
  <text x="800" y="592" text-anchor="middle" fill="#e8601a" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" letter-spacing="6">PHOTO COMING SOON</text>
  <rect x="740" y="622" width="120" height="3" rx="1.5" fill="url(#orange)" opacity=".7"/>
</svg>
